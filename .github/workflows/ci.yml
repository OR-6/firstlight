name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No secrets: replay mode, no PayPal or LLM keys. Nothing here talks to PayPal.
    env:
      DEMO_MODE: replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # ESLint with --max-warnings 0 (in the script): any warning fails the build.
      - run: npm run lint
      # Regex sentinel only (no API key). Exits non-zero if any money would
      # reach an unauthorised payee.
      - run: npm run redteam
